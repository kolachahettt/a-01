<style>
:root{
  --void:#06091c; --cream:#f4efe4; --star:#fff8e7;
  --sage:#a8c0a8; --pink:#e3a9b7; --butter:#f2d9a0; --lilac:#c3b6de;
  --soft:rgba(244,239,228,.6); --hair:rgba(244,239,228,.13);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Karla",system-ui,-apple-system,sans-serif;
  --hand:"Caveat",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--void)}
body{font-family:var(--sans);font-weight:300;color:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.held{overflow:hidden;height:100svh}
#flight,#glass{position:fixed;inset:0;display:block}
#flight{z-index:0}
#glass{z-index:1;opacity:0;pointer-events:none}
#doc{position:relative;z-index:3}
.chart{font-family:var(--sans);font-size:.6rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}

/* ignition */
#ignite{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--void);text-align:center;padding:10vw;transition:opacity 1.8s ease}
#ignite.out{opacity:0;pointer-events:none}
#firststar{appearance:none;background:none;border:0;padding:2.4rem;cursor:pointer;display:grid;place-items:center}
#firststar svg{width:116px;height:116px;overflow:visible}
#firststar .core{fill:var(--star);opacity:.4}
#firststar .ring{fill:none;stroke:var(--star);stroke-width:.5;opacity:.14}
#firststar .puls{fill:var(--star);opacity:.09;animation:breathe 3.8s ease-in-out infinite;transform-origin:60px 60px}
@keyframes breathe{0%,100%{transform:scale(.7);opacity:.05}50%{transform:scale(1.15);opacity:.17}}
#ignite .say{margin-top:.2rem;font-size:.92rem;line-height:1.85;color:var(--soft);max-width:18rem}
#ignite .chart{margin-bottom:2.2rem}

/* hud */
#hud{position:fixed;top:max(1rem,env(safe-area-inset-top));left:1.1rem;z-index:40;display:none;flex-direction:column;gap:.45rem}
#hud.show{display:flex}
#hud .rail{width:44px;height:1px;background:rgba(244,239,228,.16);position:relative}
#hud .fill{position:absolute;inset:0;width:0;background:var(--butter);transition:width .5s ease}
#mute{position:fixed;bottom:max(1rem,env(safe-area-inset-bottom));right:1.1rem;z-index:40;appearance:none;
  background:rgba(6,9,28,.4);border:1px solid var(--hair);color:var(--soft);width:38px;height:38px;border-radius:50%;
  display:none;place-items:center;padding:0;cursor:pointer;backdrop-filter:blur(8px)}
#mute.show{display:grid}
#mute svg{width:15px;height:15px;fill:currentColor}
#mute[data-on="0"] .a{display:none}
#mute[data-on="1"] .b{display:none}

/* the ride: every beat lands somewhere different */
.beat{position:relative;min-height:118svh;display:flex;padding:0 7vw}
.beat .body{max-width:min(88vw,22rem)}
.beat .k{display:block;margin-bottom:1rem;opacity:0}
.beat .line{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,7.6vw,2.6rem);line-height:1.16;
  letter-spacing:-.012em;margin:0}
.beat .line .w{display:inline-block;opacity:0;will-change:transform,opacity}
.beat .said{font-size:.98rem;line-height:1.9;color:var(--soft);margin:1.3rem 0 0;opacity:0}
.p-left{align-items:center;justify-content:flex-start}
.p-right{align-items:center;justify-content:flex-end}
.p-right .body{text-align:right}
.p-low{align-items:flex-end;justify-content:center;padding-bottom:18svh}
.p-low .body{text-align:center}
.p-high{align-items:flex-start;justify-content:flex-end;padding-top:20svh}
.p-high .body{text-align:right}
.p-mid{align-items:center;justify-content:center}
.p-mid .body{text-align:center}
.p-lowleft{align-items:flex-end;justify-content:flex-start;padding-bottom:20svh}

/* plates drifting past */
.pl{position:relative;min-height:112svh;display:flex;align-items:center;padding:0 6vw}
.pl.r{justify-content:flex-end}
.pl figure{margin:0;width:min(66vw,17rem);opacity:0}
.pl .win{overflow:hidden;background:#050818;border:1px solid rgba(244,239,228,.16);padding:.5rem;aspect-ratio:4/5}
.pl .win img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88) contrast(1.05)}
.pl .win .miss{display:grid;place-items:center;height:100%;font-size:.68rem;letter-spacing:.08em;color:rgba(244,239,228,.4);text-align:center;padding:1.2rem}
.pl .meta{display:flex;justify-content:space-between;gap:.8rem;margin-top:.55rem}
.pl .cap{font-family:var(--hand);font-size:1.2rem;color:var(--soft);line-height:1.3}

/* finale */
#finale{height:520svh;position:relative}
#pin{position:sticky;top:0;height:100svh;overflow:hidden}
#pin .mid{position:absolute;inset:0}
#flower{position:absolute;left:50%;top:50%;width:min(74vw,25rem);height:auto;overflow:visible;opacity:0;transform:translate(-50%,-50%)}
#flower .petal{fill:#f2c04a}
#flower .petal2{fill:#f7dc94}
#flower .seed{fill:#4a2c14}
#flower .disc{fill:#6b4a26}
#lab{position:absolute;left:0;right:0;bottom:15svh;text-align:center;opacity:0;padding:0 7vw}
#lab .big{font-family:var(--serif);font-size:clamp(1.6rem,7.4vw,2.5rem);font-weight:400;line-height:1.16;margin:.55rem 0 0}
#cap{position:absolute;left:50%;bottom:8svh;transform:translateX(-50%);width:min(88vw,26rem);opacity:0}
#cap dl{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;margin:0 0 .9rem;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:.85rem 0}
#cap dt{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
#cap dd{margin:0;font-size:.8rem;color:rgba(244,239,228,.8)}
#cap .mean{font-size:.84rem;line-height:1.85;color:var(--soft);margin:0}
#motto{position:absolute;left:0;right:0;bottom:12svh;text-align:center;font-family:var(--hand);
  font-size:clamp(2.1rem,10vw,3.6rem);color:var(--butter);opacity:0;clip-path:inset(0 100% 0 0);padding:0 6vw}
#edge{position:absolute;inset:0;pointer-events:none;opacity:0}
#edge span{position:absolute;font-family:var(--sans);font-size:.54rem;letter-spacing:.2em;color:rgba(168,192,168,.45)}
#edge .n{top:2rem;left:50%;transform:translateX(-50%)}
#edge .tl{top:2rem;left:1.3rem}
#edge .tr{top:2rem;right:1.3rem}
#edge .bl{bottom:2rem;left:1.3rem}

/* outro */
#outro{padding:20svh 8vw 16svh;display:flex;flex-direction:column;align-items:center}
#outro p{font-size:clamp(1.02rem,4.4vw,1.14rem);line-height:1.95;margin:0 0 1.35em;max-width:31rem;width:100%;opacity:0}
#outro .wave{font-family:var(--hand);font-size:clamp(1.35rem,6vw,1.75rem);color:var(--butter);max-width:31rem;width:100%;margin-top:1.4rem}
#sig{font-family:var(--hand);font-size:clamp(2.1rem,9vw,3rem);max-width:31rem;width:100%;margin:2rem 0 0;
  clip-path:inset(0 100% 0 0);opacity:1}
#usplate{width:min(70vw,18rem);margin:min(9svh,3.5rem) 0;align-self:center;opacity:0}
#usplate .win{overflow:hidden;background:#050818;border:1px solid rgba(244,239,228,.16);padding:.5rem;aspect-ratio:79/150}
#usplate .win img{width:100%;height:100%;object-fit:cover;display:block}
#usplate .meta{display:flex;justify-content:space-between;margin-top:.55rem}
#usplate .cap{font-family:var(--hand);font-size:1.2rem;color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:3rem;max-width:31rem;width:100%}
.acts button,.acts a{appearance:none;background:none;border:1px solid var(--hair);color:var(--soft);
  font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:.68rem 1.3rem;
  cursor:pointer;text-decoration:none}
.acts button:hover,.acts a:hover{color:var(--cream);border-color:currentColor}
#secret{max-width:31rem;width:100%;margin-top:2.2rem;padding:1.4rem;border:1px solid rgba(227,169,183,.32);
  background:rgba(227,169,183,.05);display:none}
#secret.show{display:block}
#secret .chart{color:var(--pink);margin-bottom:.6rem}
#secret p{font-size:.96rem;line-height:1.85;margin:0;opacity:1}
@media (prefers-reduced-motion:reduce){
  .beat .k,.beat .said,.beat .line .w,.pl figure,#outro p,#usplate{opacity:1!important;transform:none!important}
  #sig,#motto{clip-path:none!important}
  #firststar .puls{animation:none}
}
</style>
</head>

<script>
/* ============================================================
   ANNISSA — every word she reads lives in here.
   ============================================================ */
window.CONTENT = {
  name: "Annissa",

  /* the flight. one star per beat. pos = where it lands on screen. */
  beats: [
    { pos: "p-mid", k: "star one \u00b7 lit",
      line: "Don't sit up. Just let it move.",
      said: "You're going somewhere. It takes about four minutes and you don't have to do anything." },

    { pos: "p-left", k: "star two \u00b7 3am \u00b7 brightest",
      line: "You pick up at 3am like it's 3pm.",
      said: "No hello. No complaining. Never once asked what time it was. Straight to the problem. People talk about having someone like that." },

    { pos: "p-right", k: "star three \u00b7 on record",
      line: "You were right and I never said it.",
      said: "Not once out loud. You never made it a thing either. You'd find another way round until I got there myself and got to feel clever about it. Screenshot this." },

    { pos: "p-lowleft", k: "star four \u00b7 always you",
      line: "You hear everything first.",
      said: "Good news, bad news, nothing news. And you're the only person I cry in front of. I grew up around you and around the way you look after people." },

    { pos: "p-high", k: "star five \u00b7 audible",
      line: "I can hear you from another room.",
      said: "Sometimes another floor. By now those nurses have met the lisp, the laugh, and the yapping. Go easy on them, they're trying to work." },

    { pos: "p-left", k: "star six \u00b7 never empty handed",
      line: "There is always a chocolate.",
      said: "I never ask, you never mention it, it's just there." },

    { pos: "p-low", k: "star seven \u00b7 quietly",
      line: "You stayed when there was nothing to say.",
      said: "You didn't try to fix it. You just didn't leave. That was the fix." },

    { pos: "p-right", k: "star eight \u00b7 the whole point",
      line: "Nothing happened. I just like you.",
      said: "Some people are hard work. You're a relief. That's the entire thing, and it's the last star before you see where you've been going." }
  ],

  photos: [
    { file: "1-palm.jpg", side: "l", cap: "wuv you. same as always.", desig: "plate i" },
    { file: "2-jenga.jpg", side: "r", cap: "I took this one.", desig: "plate ii" },
    { file: "3-cotton.jpg", side: "l", cap: "cutest you've ever looked.", desig: "plate iii" }
  ],

  bike: { k: "figure one", big: "Of course it's the bike." },
  named: { k: "figure two", big: "Same eight stars. Look again." },
  chart: {
    designation: "A\u201301",
    stars: "32, plus her",
    brightest: "3am, mag \u22121.4",
    visible: "any bed, any night",
    meaning: "Named from the Arabic anisa \u2014 the one whose company puts you at ease. Which is a lot to ask of a person, and you have never once dropped it."
  },
  her: { k: "the ninth", big: "And this one is you." },
  motto: "live young, live free",

  outro: [
    "A few days ago they took out one small piece of you that had no business being there, and you didn't fall down. That's the whole medical story and I'm not making it bigger than it is.",
    "Take the medicine. Sleep more than seems reasonable. Don't bend, don't lift, don't be a hero about any of it.",
    "I couldn't be on the chair next to your bed. So I put you in the sky and grew you a sunflower instead."
  ],
  us: { file: "4-us.jpg", cap: "and this is us", desig: "plate iv" },
  usLine: "Nothing about this one needs changing. Heal up properly and we'll take a much worse version of it.",
  waveLine: "I'd wave, but you'd only call me Sejal again.",
  signature: "\u2014 Het",

  secret: { k: "you caught it", body: "Nobody was supposed to be quick enough for that. Of course it was you. Now go back to resting." },

  /* your email here and she gets a reply button. leave blank to hide it. */
  replyTo: "kolachahett@gmail.com",
  replySubject: "found all nine"
};
</script>

}

function fit() {

function edges(list, pts, t, a, col) {
  if (t <= 0 || a <= 0) return;
  const n = list.length, full = Math.floor(t*n), fr = t*n - full;
  g2.strokeStyle = col; g2.lineWidth = 0.9; g2.globalAlpha = a;
  g2.beginPath();
  for (let i = 0; i < Math.min(full, n); i++) {
    const [p, q] = list[i];
    g2.moveTo(pts[p][0], pts[p][1]); g2.lineTo(pts[q][0], pts[q][1]);
  }
  if (full < n && fr > 0) {
    const [p, q] = list[full];
    g2.moveTo(pts[p][0], pts[p][1]);
    g2.lineTo(pts[p][0] + (pts[q][0]-pts[p][0])*fr, pts[p][1] + (pts[q][1]-pts[p][1])*fr);
  }
  g2.stroke(); g2.globalAlpha = 1;
}
function dot(x, y, r, a, col) {
  g2.globalAlpha = a; g2.fillStyle = col;
  g2.beginPath(); g2.arc(x, y, r, 0, 6.283); g2.fill();
  g2.globalAlpha = a*0.2;
  g2.beginPath(); g2.arc(x, y, r*4, 0, 6.283); g2.fill();
  g2.globalAlpha = 1;
}

/* ---------------- loop ---------------- */
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
if (!calm) addEventListener('pointermove', e => {
  ptr.tx = (e.clientX/innerWidth - 0.5)*2; ptr.ty = (e.clientY/innerHeight - 0.5)*2;
}, { passive: true });

let lastZ = 0, vel = 0, t0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const t = (now - t0)/1000;

  if (ana) {
    ana.getByteFrequencyData(freq);
    let s = 0; for (let i = 2; i < 14; i++) s += freq[i];
    if (s === 0 && !bgm.paused) { if (++dead > 150) ana = null; } else dead = 0;
    pulse += (s/12/255 - pulse)*0.15;
  } else {
    pulse += ((0.42 + 0.58*Math.abs(Math.sin(t*Math.PI*112/60))) - pulse)*0.07;
  }

  if (webgl) {
    const z = -flight*CORRIDOR;
    vel += (Math.abs(z - lastZ) - vel)*0.14; lastZ = z;
    ptr.x += (ptr.tx - ptr.x)*0.045; ptr.y += (ptr.ty - ptr.y)*0.045;
    cam.position.set(
      Math.sin(flight*7.4)*26 + ptr.x*22,
      Math.cos(flight*5.1)*16 - ptr.y*16,
      z + 220
    );
    cam.lookAt(Math.sin(flight*7.4 + 0.5)*22, Math.cos(flight*5.1 + 0.5)*12, z - 500);
    field.material.size = 3.4 + pulse*1.5;
    sU.uLen.value = Math.min(150, vel*3.1);
    sU.uA.value = Math.min(0.5, vel*0.014);
    nebula.forEach((n, i) => { n.material.rotation = t*0.006*(i%2 ? 1 : -1); });
    waypoints.forEach((w, i) => {
      const d = Math.abs(w.position.z - z);
      const near = 1 - Math.min(1, d/700);
      w.material.opacity = w.userData.base*(0.18 + 0.82*near)*(0.75 + 0.25*pulse);
      const k = (w.userData.big ? 96 : 62)*(1 + near*0.55 + pulse*0.16);
      w.scale.set(k, k, 1);
    });
    R.render(scene, cam);
  }

  /* finale overlay */
  const on = inFinale ? ramp(S, 0.0, 0.10) : 0;
  gc.style.opacity = String(on);
  if (on > 0.001) {
    g2.clearRect(0, 0, W, H);
    const gather = ramp(S, 0.02, 0.14);
    const settle = eio(ramp(S, 0.06, 0.28));
    const bd = ramp(S, 0.26, 0.44);
    const ba = win2(S, 0.26, 0.34, 0.50, 0.58);
    const morph = eio(ramp(S, 0.55, 0.68));
    const nd = ramp(S, 0.68, 0.80);
    const na = ramp(S, 0.66, 0.74);
    const herIn = ramp(S, 0.80, 0.86);
    const dim = 1 - ramp(S, 0.88, 0.96);
    const { s: sc, ox, oy } = fit();
    const P = p => [ox + p[0]*sc, oy + p[1]*sc];
    const pts = BIKE.map((bp, i) => {
      const np = NAME[MAP[i]] || bp;
      const mx = bp[0] + (np[0]-bp[0])*morph, my = bp[1] + (np[1]-bp[1])*morph;
      const sx = scatter[i][0]*SP.w, sy = scatter[i][1]*SP.h;
      return P([sx + (mx-sx)*settle, sy + (my-sy)*settle]);
    });
    if (ba > 0) edges(BIKE_E, pts, bd, ba*0.72*dim, '#c3b6de');
    if (na > 0) edges(NAME_E_B, pts, nd, na*0.85*dim, '#c3b6de');
    for (let i = 0; i < pts.length; i++) {
      const b = BSET.has(i);
      dot(pts[i][0], pts[i][1], (b ? 2.6 : 1.05)*(1 + (b ? 0.34 : 0.1)*pulse),
        gather*(b ? 0.98 : 0.6)*dim, b ? '#fff8e7' : '#e9e3d2');
      if (b && i === 17 && na > 0.5) {
        g2.globalAlpha = (na - 0.5)*2*dim; g2.fillStyle = '#a8c0a8';
        g2.font = '10px Karla, sans-serif'; g2.fillText('3 A M', pts[i][0] + 11, pts[i][1] - 9);
        g2.globalAlpha = 1;
      }
    }
    if (herIn > 0) {
      const hp = P(HER);
      dot(hp[0], hp[1], 3.6*(1 + 0.45*pulse), herIn*dim, '#e3a9b7');
      g2.globalAlpha = herIn*dim; g2.fillStyle = '#e3a9b7';
      g2.font = '10px Karla, sans-serif'; g2.textAlign = 'center';
      g2.fillText('YOU ARE HERE', hp[0], hp[1] + 24);
      g2.textAlign = 'left'; g2.globalAlpha = 1;
    }

    const st = S < 0.52 ? 0 : S < 0.80 ? 1 : 2;
    if (st !== stage) {
      stage = st;
      const L = st === 0 ? C.bike : st === 1 ? C.named : C.her;
      labK.textContent = L.k; labB.textContent = L.big;
    }
    labEl.style.opacity = String(
      st === 0 ? win2(S, 0.44, 0.48, 0.50, 0.55)
      : st === 1 ? win2(S, 0.74, 0.78, 0.79, 0.83)
      : win2(S, 0.81, 0.85, 0.88, 0.93));
    capEl.style.opacity = String(win2(S, 0.78, 0.82, 0.87, 0.92));
    edgeEl.style.opacity = String(win2(S, 0.10, 0.18, 0.90, 0.97)*0.9);
    if (S > 0.90) { bloom(); placeFlower(); } else unbloom();
  } else {
    labEl.style.opacity = '0'; capEl.style.opacity = '0'; edgeEl.style.opacity = '0';
    if (stage !== -1) { stage = -1; }
    if (S < 0.5) unbloom();
    if (comet) {
      comet.t += 0.011;
      if (comet.t >= 1) comet = null;
      else {
        const x = comet.x + comet.dx*comet.t, y = comet.y + comet.dy*comet.t;
        const bx = comet.x + comet.dx*Math.max(0, comet.t - 0.12), by = comet.y + comet.dy*Math.max(0, comet.t - 0.12);
        const a = Math.sin(Math.PI*comet.t);
        g2.clearRect(0, 0, W, H);
        gc.style.opacity = '1';
        const lgd = g2.createLinearGradient(bx, by, x, y);
        lgd.addColorStop(0, 'rgba(255,248,231,0)'); lgd.addColorStop(1, 'rgba(255,248,231,' + (0.9*a) + ')');
        g2.strokeStyle = lgd; g2.lineWidth = 1.7;
        g2.beginPath(); g2.moveTo(bx, by); g2.lineTo(x, y); g2.stroke();
        dot(x, y, 2, a, '#fff8e7');
      }
    }
  }
}
requestAnimationFrame(loop);

const title = document.title;
document.addEventListener('visibilitychange', () => {
  document.title = document.hidden ? 'come back, Annissa' : title;
});
</script>
