<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>prescription</title>
<meta name="theme-color" content="#070b1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Karla:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--void:#070b1e;--paper:#f6f0e2;--ink:#2b2a26;--muted:#8a8272;--rule:#d8cfb8;
    --red:#b03a32;--hand:'Caveat',cursive;--sans:'Karla',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:
    radial-gradient(120% 90% at 50% 0%,#18204a 0%,#0b1230 45%,#070b1e 100%) fixed;
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #wrap{min-height:100svh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:5svh 4vw 7svh;gap:1.6rem}
  /* ---------- the pad ---------- */
  #pad{position:relative;width:min(100%,430px);background:var(--paper);
    box-shadow:0 26px 60px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.5) inset;
    transform:rotate(-.5deg);padding:0 0 0;border-radius:2px}
  #pad:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;
    background-image:radial-gradient(rgba(120,108,82,.14) .5px,transparent .5px);
    background-size:4px 4px;opacity:.55;mix-blend-mode:multiply}
  .perf{display:block;width:100%;height:11px}
  .body{padding:1.1rem 1.5rem 1.4rem}
  /* ---------- letterhead ---------- */
  .head{display:flex;align-items:center;gap:.8rem;border-bottom:2px solid var(--ink);padding-bottom:.7rem}
  .crest{flex:0 0 auto;width:42px;height:42px}
  .who{line-height:1.12}
  .who b{display:block;font-family:var(--serif);font-size:1.12rem;letter-spacing:.01em}
  .who span{display:block;font-size:.53rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .lic{margin-left:auto;text-align:right;font-size:.5rem;letter-spacing:.16em;color:var(--muted);line-height:1.6;text-transform:uppercase}
  /* ---------- patient block ---------- */
  .pt{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .9rem;margin:.85rem 0 .2rem}
  .pt div{display:flex;align-items:baseline;gap:.4rem;border-bottom:1px solid var(--rule);padding-bottom:2px}
  .pt label{font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
  .pt em{font-family:var(--hand);font-size:1.02rem;font-style:normal;color:#3c3a33}
  .dx{margin:.55rem 0 0;border-bottom:1px solid var(--rule);padding-bottom:3px;display:flex;gap:.4rem;align-items:baseline}
  .dx label{font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
  .dx em{font-family:var(--hand);font-size:.98rem;font-style:normal;color:#3c3a33;line-height:1.2}
  /* ---------- rx ---------- */
  .rxrow{display:flex;gap:.7rem;margin-top:1rem}
  .rxsym{font-family:var(--serif);font-size:2.5rem;line-height:.82;color:var(--ink)}
  .rxsym i{font-style:italic}
  ol{margin:0;padding:0;list-style:none;counter-reset:rx;flex:1}
  ol li{counter-increment:rx;padding:.38rem 0 .42rem 1.35rem;position:relative;border-bottom:1px dotted var(--rule)}
  ol li:before{content:counter(rx) ".";position:absolute;left:0;top:.44rem;font-size:.62rem;color:var(--muted)}
  .nm{font-family:var(--hand);font-size:1.2rem;line-height:1.05;color:#332f27}
  .ds{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .nt{font-size:.68rem;color:#6d6555;margin-top:3px;line-height:1.32}
  /* ---------- do not ---------- */
  .dn{margin-top:1rem;border:1.5px dashed var(--red);padding:.6rem .75rem;border-radius:3px}
  .dn h4{margin:0 0 .3rem;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
  .dn p{margin:.18rem 0;font-size:.74rem;line-height:1.36;color:#5f5748;display:flex;gap:.45rem}
  .dn p:before{content:"\2715";color:var(--red);font-size:.66rem;flex:0 0 auto;margin-top:1px}
  /* ---------- sign off ---------- */
  .foot{display:flex;align-items:flex-end;gap:1rem;margin-top:1.1rem}
  .sig{flex:1}
  .sig .ink{font-family:var(--hand);font-size:1.7rem;color:#2f3a5e;line-height:.9;transform:rotate(-3deg);transform-origin:left bottom}
  .sig hr{border:0;border-top:1px solid var(--ink);margin:.3rem 0 .22rem}
  .sig small{font-size:.47rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
  .bars{flex:0 0 auto;text-align:center}
  .bars small{display:block;font-size:.42rem;letter-spacing:.16em;color:var(--muted);margin-top:2px}
  /* ---------- stamp ---------- */
  .stamp{position:absolute;right:8px;bottom:86px;width:118px;height:118px;opacity:.7;
    transform:rotate(-16deg);pointer-events:none;mix-blend-mode:multiply}
  /* ---------- tear-off ---------- */
  .tear{border-top:1.5px dashed var(--rule);margin-top:1.1rem;padding-top:.6rem;
    display:flex;align-items:center;gap:.6rem;justify-content:space-between}
  .tear p{margin:0;font-family:var(--hand);font-size:1rem;color:#5f5748;line-height:1.15}
  .tear b{font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
  /* ---------- controls ---------- */
  #again{appearance:none;border:1px solid rgba(244,239,228,.3);background:rgba(244,239,228,.06);
    color:#f4efe4;font-family:var(--sans);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;
    padding:.8rem 1.5rem;border-radius:100px;cursor:pointer;transition:background .25s,border-color .25s;
    -webkit-tap-highlight-color:transparent}
  #again:hover,#again:focus-visible{background:rgba(244,239,228,.14);border-color:rgba(244,239,228,.55);outline:none}
  #back{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,239,228,.45);
    text-decoration:none;border-bottom:1px solid rgba(244,239,228,.2);padding-bottom:3px}
  #pad.flip{animation:flip .55s cubic-bezier(.3,.9,.3,1)}
  @keyframes flip{0%{transform:rotate(-.5deg) scale(1)}45%{transform:rotate(1.2deg) scale(.975)}100%{transform:rotate(-.5deg) scale(1)}}
  @media (prefers-reduced-motion:reduce){#pad.flip{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="pad">
    <svg class="perf" viewBox="0 0 430 11" preserveAspectRatio="none" aria-hidden="true">
      <path id="perfpath" fill="#f6f0e2"></path>
    </svg>
    <div class="body">
      <div class="head">
        <svg class="crest" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="20.5" fill="none" stroke="#2b2a26" stroke-width="1.3"/>
          <circle cx="22" cy="22" r="17" fill="none" stroke="#2b2a26" stroke-width=".6"/>
          <g id="crestpetals"></g>
          <circle cx="22" cy="22" r="4.4" fill="#2b2a26"/>
        </svg>
        <div class="who">
          <b>Het &amp; Co.</b>
          <span>Dept. of Unqualified Medicine</span>
        </div>
        <div class="lic">Lic. none<br>Est. long ago</div>
      </div>

      <div class="pt">
        <div><label>Patient</label><em>Annissa</em></div>
        <div><label>A.k.a.</label><em id="aka">Chaku</em></div>
        <div><label>Date</label><em id="date">today</em></div>
        <div><label>Ward</label><em>her own bed</em></div>
      </div>
      <div class="dx"><label>Dx</label><em id="dx"></em></div>

      <div class="rxrow">
        <div class="rxsym">&#8478;</div>
        <ol id="list"></ol>
      </div>

      <div class="dn">
        <h4>Strictly not permitted</h4>
        <div id="donts"></div>
      </div>

      <div class="foot">
        <div class="sig">
          <div class="ink">Het</div>
          <hr>
          <small>Prescriber &middot; not a doctor &middot; deeply invested</small>
        </div>
        <div class="bars">
          <svg id="barcode" width="86" height="30" aria-hidden="true"></svg>
          <small id="bcnum"></small>
        </div>
      </div>

      <div class="tear">
        <b>Refills &#8734;</b>
        <p id="footer"></p>
      </div>
    </div>
    <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
      <defs><path id="arcTop" d="M18 60 A42 42 0 0 1 102 60"/><path id="arcBot" d="M22 60 A38 38 0 0 0 98 60"/></defs>
      <circle cx="60" cy="60" r="52" fill="none" stroke="#b03a32" stroke-width="3.4"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#b03a32" stroke-width="1.4"/>
      <text font-family="Karla,sans-serif" font-size="11" font-weight="700" fill="#b03a32" letter-spacing="2.4">
        <textPath href="#arcTop" startOffset="50%" text-anchor="middle" id="stampTop"></textPath>
      </text>
      <text font-family="Karla,sans-serif" font-size="8" fill="#b03a32" letter-spacing="2">
        <textPath href="#arcBot" startOffset="50%" text-anchor="middle">HET &#183; AND &#183; CO</textPath>
      </text>
      <g id="stampStar"></g>
    </svg>
  </div>
  <button id="again" type="button">write another</button>
  <a id="back" href="./">back to the sky</a>
</div>
<script>
const RX = [
  ["Horizontal Living","one (1) bed","continuously","Vertical is cancelled until further notice."],
  ["Yapping","45 minutes","twice daily","Do not exceed the dose. Actually, do exceed it."],
  ["Chocolate","1 bar","as needed","Patient is known to supply others. This one is hers."],
  ["Being Right","unlimited","ongoing","Condition is chronic. No treatment recommended."],
  ["3am Phone Calls","1 call","nightly","Receiving only. Patient is not to place them."],
  ["Royal Enfield","0 km","for six weeks","The bike is fine. Stop asking about the bike."],
  ["Sitting Up","0 attempts","never","She is attempting it right now. Stop her."],
  ["Laughing","until it hurts","often","Then slightly past that."],
  ["Water","3 litres","daily","Yes, actually water. Chai does not count."],
  ["Sunlight","12 minutes","daily","The window counts. Barely."],
  ["Saying \u2018I\u2019m fine\u2019","0 doses","never","Phrase has been removed from the formulary."],
  ["Accepting Help","1 dose","daily","Known to cause discomfort. Take it anyway."],
  ["Napping","2 naps","daily","A nap is not a character flaw."],
  ["Complaining","1 session","daily","To Het specifically. He is contractually obliged."],
  ["Tomatoes","1","daily","Prescribed on the grounds that she is one."],
  ["Physiotherapy","as instructed","daily","Boring. Non-negotiable."],
  ["The Lisp","do not treat","permanent","Beloved. Leave it exactly where it is."],
  ["Waving At People","1 wave","daily","Side effects may include being called Sejal."],
  ["Being Looked After","full course","until finished","Patient has never completed this course. Start now."],
  ["Loud Opinions","3 per hour","minimum","The nurses have already met this dose."]
];
const DONT = [
  "Lift anything heavier than a chocolate.",
  "Reorganise your entire room \u2018quickly\u2019.",
  "Tell anyone you are fine when you are not fine.",
  "Twist. Not even slightly. Not even to look at something.",
  "Bend down to pick things up. Ask someone. Yes, ask.",
  "Carry everybody else\u2019s problems this week.",
  "Google your own symptoms at 2am.",
  "Say \u2018it\u2019s only a small pain\u2019.",
  "Get on anything with two wheels.",
  "Argue with this prescription. It is laminated.",
  "Answer work messages. They will survive.",
  "Stand up to prove a point."
];
const STAMPS = ["CHECKED TWICE","NOT A REAL DOCTOR","APPROVED BY HET","SECOND OPINION: ALSO ME",
  "VALID FOREVER","DO NOT ARGUE","PRESCRIBER IS BIASED","SEALED WITH CONCERN","NO REFUNDS"];
const FOOTERS = [
  "Present this at any hour. He is obliged to comply.",
  "Refills: unlimited. Forever. Obviously.",
  "If symptoms persist, call. If they don\u2019t, still call.",
  "Legally meaningless. Emotionally binding.",
  "Prescriber\u2019s note: she is going to ignore all of this.",
  "Not covered by insurance. Covered by him.",
  "Second opinions available, but they will agree with me.",
  "This document has been notarised by nobody."
];
const DIAG = [
  "One (1) small piece removed that had no business being there",
  "Acute case of doing too much for other people",
  "Post-operative, pre-nonsense",
  "Structurally sound. Emotionally load-bearing.",
  "Spine: repaired. Stubbornness: untreated.",
  "Otherwise in perfect working order"
];

const $ = id => document.getElementById(id);
const pick = a => a[(Math.random() * a.length) | 0];
function some(arr, n) {
  const c = arr.slice();
  for (let i = c.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [c[i], c[j]] = [c[j], c[i]]; }
  return c.slice(0, n);
}
/* torn perforation along the top edge */
(() => {
  let d = 'M0 11 L0 6 ';
  for (let x = 0; x < 430; x += 10) d += `Q${x + 5} ${x % 20 ? 0 : 11} ${x + 10} 6 `;
  $('perfpath').setAttribute('d', d + 'L430 11 Z');
})();
/* the crest is a small sunflower */
(() => {
  let o = '';
  for (let k = 0; k < 16; k++)
    o += `<ellipse cx="22" cy="12.4" rx="1.7" ry="5.2" fill="#2b2a26" transform="rotate(${k * 22.5} 22 22)"/>`;
  $('crestpetals').innerHTML = o;
  let s = '';
  for (let k = 0; k < 5; k++) {
    const a = (k * 72 - 90) * Math.PI / 180;
    s += `<circle cx="${(60 + Math.cos(a) * 26).toFixed(1)}" cy="${(60 + Math.sin(a) * 26).toFixed(1)}" r="2.6" fill="#b03a32"/>`;
  }
  $('stampStar').innerHTML = s;
})();
function roll() {
  const three = some(RX, 3);
  $('list').innerHTML = three.map(r =>
    `<li><div class="nm">${r[0]}</div><div class="ds">${r[1]} &middot; ${r[2]}</div><div class="nt">${r[3]}</div></li>`
  ).join('');
  $('donts').innerHTML = some(DONT, 3).map(t => `<p>${t}</p>`).join('');
  $('dx').textContent = pick(DIAG);
  $('footer').textContent = pick(FOOTERS);
  $('stampTop').textContent = pick(STAMPS);
  $('aka').textContent = pick(['Chaku', 'Tametu', 'blue', 'Chaku', 'the loud one']);
  $('date').textContent = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  /* a fresh barcode every time */
  let b = '', x = 0;
  while (x < 84) { const w = 1 + ((Math.random() * 3) | 0); b += `<rect x="${x}" y="0" width="${w}" height="30" fill="#2b2a26"/>`; x += w + 1 + ((Math.random() * 2) | 0); }
  $('barcode').innerHTML = b;
  $('bcnum').textContent = String(Math.floor(Math.random() * 9e9) + 1e9).replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3');
  const pad = $('pad');
  pad.classList.remove('flip'); void pad.offsetWidth; pad.classList.add('flip');
}
$('again').addEventListener('click', roll);
roll();
</script>
</body>
</html>
